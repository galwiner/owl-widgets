[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owl-widgets"
version = "0.1.1"
description = "OWL: composable optics widgets for Python notebooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/owl/static/PLOTLY-LICENSE.txt"]
requires-python = ">=3.12"
dependencies = ["numpy>=2", "anywidget>=0.9", "traitlets>=5"]

[project.urls]
Homepage = "https://github.com/galwiner/owl-widgets"
Repository = "https://github.com/galwiner/owl-widgets"
Issues = "https://github.com/galwiner/owl-widgets/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/owl"]

[tool.hatch.build.targets.sdist]
include = ["/src/owl", "/tests", "/notebooks", "/pyproject.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/SECURITY.md", "/CONTRIBUTING.md"]
